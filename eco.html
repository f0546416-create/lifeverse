<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeVerse | Eco Challenges</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/eco.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <!-- Mobile topbar -->
  <div class="topbar">
    <span class="topbar-logo">🌱 LifeVerse</span>
    <button class="menu-btn"><i class="fas fa-bars"></i></button>
  </div>

  <div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
      <button class="sidebar-close"><i class="fas fa-times"></i></button>
      <div class="logo">🌱 LifeVerse</div>
      <nav>
        <ul>
          <li onclick="location.href='dashboard.html'"><i class="fas fa-house"></i> Dashboard</li>
          <li class="active"><i class="fas fa-leaf"></i> Eco Challenges</li>
          <li onclick="location.href='bills.html'"><i class="fas fa-file-invoice"></i> Bills</li>
          <li onclick="location.href='quests.html'"><i class="fas fa-flag"></i> Quests</li>
          <li onclick="location.href='analytics.html'"><i class="fas fa-chart-line"></i> Analytics</li>
          <li onclick="location.href='profile.html'"><i class="fas fa-user"></i> Profile</li>
        </ul>
      </nav>
    </aside>

    <!-- Main -->
    <main class="content">

      <div class="eco-header">
        <h1>🌿 Eco Challenges</h1>
        <p>Complete daily challenges to earn XP, Eco Coins, and help the planet.</p>
      </div>

      <!-- Eco Stats -->
      <section class="eco-stats">
        <div class="eco-stat">
          <h2 id="xp">850</h2>
          <p>Total XP</p>
        </div>
        <div class="eco-stat">
          <h2 id="coins">1250</h2>
          <p>Eco Coins</p>
        </div>
        <div class="eco-stat">
          <h2 id="level">5</h2>
          <p>Level</p>
        </div>
        <div class="eco-stat">
          <h2 id="completedToday">0</h2>
          <p>Completed Today</p>
        </div>
      </section>

      <h2 class="section-title"><i class="fas fa-sun"></i> Daily Challenges</h2>
      <section class="challenge-grid" id="challengeGrid">
        <!-- Injected by JS -->
      </section>

    </main>
  </div>

  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
  <script>
    /* =============================================
       ECO CHALLENGES — inline logic
    ============================================= */

    const CHALLENGES = [
      { id:'eco1', icon:'♻️', title:'Recycle 5 Plastic Bottles', desc:'Collect and recycle five plastic bottles from around your home or neighbourhood.', difficulty:'easy',   xp:100, coins:50  },
      { id:'eco2', icon:'💡', title:'Save Electricity',           desc:'Turn off all lights and unplug devices you are not using for the day.',              difficulty:'easy',   xp:150, coins:75  },
      { id:'eco3', icon:'🚶', title:'Walk Instead of Driving',    desc:'Choose to walk or cycle for short trips instead of taking a car today.',              difficulty:'medium', xp:200, coins:100 },
      { id:'eco4', icon:'🌳', title:'Plant a Tree',               desc:'Plant a tree in your garden or sponsor a tree through a verified platform.',          difficulty:'hard',   xp:500, coins:300 },
      { id:'eco5', icon:'🛒', title:'Buy Local Produce',          desc:'Purchase fruits or vegetables from a local farm or farmers market.',                  difficulty:'easy',   xp:120, coins:60  },
      { id:'eco6', icon:'🚿', title:'Cut Your Shower Short',      desc:'Reduce your shower time to 5 minutes or less to save water.',                        difficulty:'medium', xp:180, coins:90  },
    ];

    function renderChallenges() {
      const grid  = document.getElementById('challengeGrid');
      const today = new Date().toDateString();
      let doneCount = 0;

      grid.innerHTML = CHALLENGES.map(c => {
        const key   = 'challenge_' + c.id + '_' + today;
        const done  = localStorage.getItem(key) === 'true';
        if (done) doneCount++;

        return `
          <div class="challenge-card">
            <div class="challenge-icon">${c.icon}</div>
            <h3>${c.title}</h3>
            <p>${c.desc}</p>
            <span class="difficulty ${c.difficulty}">${c.difficulty.charAt(0).toUpperCase() + c.difficulty.slice(1)}</span>
            <div class="reward-row">
              <span>⭐ +${c.xp} XP</span>
              <span>🪙 +${c.coins} Coins</span>
            </div>
            <button
              class="claim-btn ${done ? 'completed' : ''}"
              id="btn_${c.id}"
              onclick="completeChallenge('${c.id}', ${c.xp}, ${c.coins})"
              ${done ? 'disabled' : ''}>
              ${done ? '✅ Completed' : 'Complete Challenge'}
            </button>
          </div>
        `;
      }).join('');

      const el = document.getElementById('completedToday');
      if (el) el.textContent = doneCount;
    }

    function completeChallenge(id, xp, coins) {
      const today = new Date().toDateString();
      const key   = 'challenge_' + id + '_' + today;

      if (localStorage.getItem(key) === 'true') {
        showNotification('You already completed this challenge today!', 'info');
        return;
      }

      localStorage.setItem(key, 'true');
      addRewards(xp, coins);

      // increment completedQuests counter (shared with analytics)
      const prev = Number(localStorage.getItem('completedQuests')) || 0;
      localStorage.setItem('completedQuests', String(prev + 1));

      showNotification(`🌿 Challenge complete! +${xp} XP & +${coins} Coins`);
      renderChallenges();
    }

    document.addEventListener('DOMContentLoaded', renderChallenges);
  </script>
</body>
</html>
