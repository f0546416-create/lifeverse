<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeVerse | Sign Up</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <div class="auth-bg">

    <!-- Left panel -->
    <div class="auth-panel">
      <div class="auth-brand">🌱 LifeVerse</div>
      <h2>Start Your Eco Journey Today.</h2>
      <p>Create a free account and begin earning rewards for living sustainably.</p>
      <ul class="auth-features">
        <li><i class="fas fa-check-circle"></i> Free Forever</li>
        <li><i class="fas fa-check-circle"></i> Instant XP &amp; Rewards</li>
        <li><i class="fas fa-check-circle"></i> Personal Eco Dashboard</li>
        <li><i class="fas fa-check-circle"></i> AI-Powered Insights</li>
      </ul>
    </div>

    <!-- Right form -->
    <div class="auth-form-wrap">
      <div class="auth-card">
        <h1>Create Account 🌿</h1>
        <p class="auth-sub">Join the LifeVerse community</p>

        <div id="authMessage" class="auth-message" style="display:none;"></div>

        <form id="signupForm" novalidate>

          <div class="input-group">
            <label>Full Name</label>
            <div class="input-box">
              <i class="fas fa-user"></i>
              <input type="text" id="signupName" placeholder="Your full name" required>
            </div>
          </div>

          <div class="input-group">
            <label>Email Address</label>
            <div class="input-box">
              <i class="fas fa-envelope"></i>
              <input type="email" id="signupEmail" placeholder="you@example.com" required>
            </div>
          </div>

          <div class="input-group">
            <label>Password</label>
            <div class="input-box">
              <i class="fas fa-lock"></i>
              <input type="password" id="signupPassword" placeholder="At least 6 characters" required>
              <button type="button" class="toggle-pw" id="togglePwSignup" tabindex="-1">
                <i class="fas fa-eye" id="togglePwSignupIcon"></i>
              </button>
            </div>
            <div class="strength-bar"><div id="strengthFill"></div></div>
            <small id="strengthLabel" class="strength-label"></small>
          </div>

          <div class="input-group">
            <label>Confirm Password</label>
            <div class="input-box">
              <i class="fas fa-lock"></i>
              <input type="password" id="signupConfirm" placeholder="Repeat your password" required>
              <button type="button" class="toggle-pw" id="togglePwConfirm" tabindex="-1">
                <i class="fas fa-eye" id="togglePwConfirmIcon"></i>
              </button>
            </div>
          </div>

          <label class="terms-check">
            <input type="checkbox" id="agreeTerms" required>
            I agree to the <span>Terms &amp; Conditions</span>
          </label>

          <button type="submit" class="auth-btn" id="signupBtn">
            <span>Create Account</span>
            <i class="fas fa-arrow-right"></i>
          </button>

        </form>

        <p class="auth-link">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </div>
    </div>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
