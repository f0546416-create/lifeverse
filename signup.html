<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeVerse | Sign Up</title>
  <link rel="stylesheet" href="css/signup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <div class="signup-page">
    <div class="signup-card">

      <!-- Header -->
      <div class="signup-header">
        <div class="brand-icon">
          <i class="fas fa-seedling"></i>
        </div>
        <h1>Join LifeVerse</h1>
        <p>Start your eco journey today</p>
      </div>

      <!-- Message -->
      <div id="authMessage" class="auth-message" style="display:none;"></div>

      <form id="signupForm" novalidate>

        <div class="signup-form">

          <!-- Name -->
          <div class="field-group">
            <label class="field-label" for="signupName">Full Name</label>
            <div class="signup-input">
              <i class="fas fa-user input-icon"></i>
              <input type="text" id="signupName" placeholder="Your name"
                     autocomplete="name" required>
            </div>
          </div>

          <!-- Email -->
          <div class="field-group">
            <label class="field-label" for="signupEmail">Email Address</label>
            <div class="signup-input">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="signupEmail" placeholder="you@example.com"
                     autocomplete="email" required>
            </div>
          </div>

          <!-- Password -->
          <div class="field-group">
            <label class="field-label" for="signupPassword">Password</label>
            <div class="signup-input">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="signupPassword" placeholder="Create a password"
                     autocomplete="new-password" required>
              <button type="button" class="toggle-pw" id="togglePwSignup" aria-label="Toggle password">
                <i class="fas fa-eye" id="togglePwSignupIcon"></i>
              </button>
            </div>
            <!-- Strength bar -->
            <div class="strength-wrap">
              <div class="strength-bar">
                <div id="strengthFill"></div>
              </div>
              <span class="strength-label" id="strengthLabel"></span>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="field-group">
            <label class="field-label" for="signupConfirm">Confirm Password</label>
            <div class="signup-input">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="signupConfirm" placeholder="Re-enter your password"
                     autocomplete="new-password" required>
              <button type="button" class="toggle-pw" id="togglePwConfirm" aria-label="Toggle confirm password">
                <i class="fas fa-eye" id="togglePwConfirmIcon"></i>
              </button>
            </div>
          </div>

          <div class="form-divider"></div>

          <!-- Terms -->
          <label class="terms-check">
            <input type="checkbox" id="agreeTerms">
            <span>I agree to the <a href="#">Terms &amp; Conditions</a></span>
          </label>

          <!-- Submit -->
          <button type="submit" class="signup-btn" id="signupBtn" data-label="Create Account">
            <span><i class="fas fa-seedling"></i> Create Account</span>
          </button>

        </div><!-- /.signup-form -->

        <div class="auth-link">
          Already have an account? <a href="login.html">Sign In</a>
        </div>

      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
