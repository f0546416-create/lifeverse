<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeVerse | Login</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <div class="auth-card">

    <!-- Header -->
    <div class="auth-logo">🌱</div>
    <h1>Welcome Back</h1>
    <p class="auth-sub">Sign in to your LifeVerse account</p>

    <!-- Message -->
    <div id="authMessage" class="auth-message" style="display:none;"></div>

    <form id="loginForm" novalidate>

      <!-- Email -->
      <div class="input-group">
        <label for="loginEmail">Email Address</label>
        <div class="input-box">
          <i class="fas fa-envelope"></i>
          <input type="email" id="loginEmail" placeholder="you@example.com"
                 autocomplete="email" required>
        </div>
      </div>

      <!-- Password -->
      <div class="input-group">
        <label for="loginPassword">Password</label>
        <div class="input-box">
          <i class="fas fa-lock"></i>
          <input type="password" id="loginPassword" placeholder="Your password"
                 autocomplete="current-password" required>
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password">
            <i class="fas fa-eye" id="togglePwIcon"></i>
          </button>
        </div>
      </div>

      <!-- Options -->
      <div class="auth-options">
        <label class="remember">
          <input type="checkbox" id="rememberMe">
          Remember me
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button type="submit" class="auth-btn" id="loginBtn" data-label="Sign In">
        <span><i class="fas fa-right-to-bracket"></i> Sign In</span>
      </button>

    </form>

    <div class="auth-link">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </div>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
